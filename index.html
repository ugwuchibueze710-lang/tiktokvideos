<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0907">
<title>Owens TikTok Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0907; --bg2:#14100c; --card:#1a1510; --line:rgba(255,220,180,.10);
  --text:#f6efe6; --muted:#a8998a; --accent:#ff9a3c; --accent2:#ffcf7a;
  --ok:#3ddc84; --okbg:rgba(61,220,132,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
body{overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* HERO */
.hero{position:relative;height:min(92vh,860px);min-height:560px;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;
  background:linear-gradient(transparent,var(--bg));pointer-events:none}
.hero-copy{position:absolute;left:0;right:0;top:max(22px,env(safe-area-inset-top));padding:0 18px;z-index:2;text-align:center;pointer-events:none}
.eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent2);opacity:.9}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(40px,11vw,92px);line-height:.92;margin:8px 0 0;
  letter-spacing:.01em;text-shadow:0 6px 40px rgba(0,0,0,.6)}
h1 span{color:var(--accent)}
.hero-stats{position:absolute;left:0;right:0;bottom:56px;z-index:2;display:flex;justify-content:center;padding:0 16px}
.stat-pill{display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:999px;
  background:rgba(20,16,12,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}
.ring{width:38px;height:38px}
.stat-pill b{font-size:18px}
.stat-pill small{display:block;color:var(--muted);font-size:12px}
.scroll-cue{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:2;font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}

/* TOOLBAR */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,9,7,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:10px 16px calc(10px);}
.bar-in{max-width:1100px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.bar-in::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted);background:var(--bg2)}
.chip.on{background:var(--accent);color:#1b0f04;border-color:var(--accent)}
.chip .c{opacity:.7;margin-left:6px;font-weight:500}

/* GRID */
main{max-width:1100px;margin:0 auto;padding:18px 16px 80px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);text-align:left;
  transform:translateZ(0);transition:transform .25s ease,box-shadow .25s ease}
.card:active{transform:scale(.97)}
@media(hover:hover){.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.5)}}
.thumb{position:relative;aspect-ratio:9/16;background:#000}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,transparent 28%,transparent 55%,rgba(0,0,0,.85) 100%)}
.num{position:absolute;top:8px;left:10px;z-index:2;font-family:Anton,sans-serif;font-size:30px;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.play{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;z-index:2;display:grid;place-items:center;
  background:rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.3)}
.meta{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:10px}
.meta .t{font-weight:700;font-size:14px;line-height:1.2}
.meta .s{font-size:12px;color:#d9cbbb;margin-top:4px}
.done-badge{position:absolute;top:9px;right:9px;z-index:3;display:none;align-items:center;gap:4px;padding:4px 8px 4px 6px;border-radius:999px;
  background:var(--ok);color:#06210f;font-size:11px;font-weight:700}
.card.done .done-badge{display:flex}
.card.done img{filter:saturate(.35) brightness(.6)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}

/* SHEET */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.panel{position:absolute;inset:0;overflow-y:auto;padding:max(12px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center}
.panel-in{width:100%;max-width:440px}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ph .n{font-family:Anton,sans-serif;font-size:22px;color:var(--accent)}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.player{position:relative;width:100%;aspect-ratio:9/16;max-height:64vh;margin:0 auto;border-radius:18px;overflow:hidden;background:#000;
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06)}
.player video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3}
.nav.prev{left:8px}.nav.next{right:8px}
.panel h2{font-family:Anton,sans-serif;font-weight:400;font-size:26px;margin:16px 0 4px;letter-spacing:.01em}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--muted)}
.status.done{background:var(--okbg);color:var(--ok)}
.actions{display:grid;gap:10px;margin:16px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:14px;font-weight:700;font-size:16px;text-decoration:none}
.btn.primary{background:linear-gradient(180deg,#ffb15e,#ff8a1f);color:#1b0f04;box-shadow:0 10px 30px rgba(255,138,31,.3)}
.btn.primary.done{background:var(--card);color:var(--ok);border:1px solid rgba(61,220,132,.4);box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.box .lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.box p{margin:8px 0 0;line-height:1.5;font-size:14px;color:#e8ddd0}
.copy{font-size:12px;font-weight:600;color:var(--accent2);letter-spacing:0;text-transform:none}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:80;
  background:#fff;color:#111;font-weight:600;font-size:14px;padding:11px 16px;border-radius:999px;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 40px}
footer button{color:var(--accent2);text-decoration:underline}
</style>
</head>
<body>

<section class="hero">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="hero-copy">
    <div class="eyebrow">Owensboro · Henderson · Kentucky</div>
    <h1>OWENS <span>TIKTOK</span><br>VAULT</h1>
  </div>
  <div class="hero-stats">
    <div class="stat-pill">
      <svg class="ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="4"/>
        <circle id="ringFg" cx="20" cy="20" r="16" fill="none" stroke="#3ddc84" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="100.5" stroke-dashoffset="100.5" transform="rotate(-90 20 20)" style="transition:stroke-dashoffset .6s"/></svg>
      <div><b id="statTxt">0 / 24</b><small>downloaded on this device</small></div>
    </div>
  </div>
  <div class="scroll-cue">Scroll ↓</div>
</section>

<div class="bar"><div class="bar-in" id="filters">
  <button class="chip on" data-f="all">All<span class="c" id="cAll"></span></button>
  <button class="chip" data-f="todo">Not downloaded<span class="c" id="cTodo"></span></button>
  <button class="chip" data-f="done">Downloaded<span class="c" id="cDone"></span></button>
</div></div>

<main><div class="grid" id="grid"></div></main>
<footer>Downloaded marks are saved on this device. <button id="resetBtn">Reset all marks</button></footer>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="backdrop" data-close></div>
  <div class="panel" data-close>
    <div class="panel-in">
      <div class="ph"><span class="n" id="sNum">#01</span>
        <button class="iconbtn" data-close aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="player">
        <video id="vid" playsinline controls preload="metadata"></video>
        <button class="iconbtn nav prev" id="prevBtn" aria-label="Previous"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="iconbtn nav next" id="nextBtn" aria-label="Next"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <h2 id="sTitle"></h2>
      <span class="status" id="sStatus"></span>
      <div class="actions">
        <a class="btn primary" id="dlBtn" download></a>
        <div class="row2">
          <button class="btn ghost" id="shareBtn">Save to Photos</button>
          <button class="btn ghost" id="toggleBtn"></button>
        </div>
      </div>
      <div class="box"><div class="lbl">Post caption <button class="copy" data-copy="caption">Copy</button></div><p id="sCap"></p></div>
      <div class="box"><div class="lbl">On-screen title <button class="copy" data-copy="screen">Copy</button></div><p id="sScreen"></p></div>
      <div class="box"><div class="lbl">Voiceover</div><p id="sVo"></p></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
/* ---------- data + state ---------- */
const VIDEOS = await fetch('videos.json').then(r=>r.json());
const KEY='owensVault.downloaded.v1';
let done = new Set();
try{ done = new Set(JSON.parse(localStorage.getItem(KEY)||'[]')); }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify([...done])); }catch(e){} };
const pad=n=>String(n).padStart(2,'0');
const url=v=>encodeURIComponent(v.file);
let filter='all', current=-1;

const $=id=>document.getElementById(id);
const grid=$('grid');
const toast=(m)=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)};

const checkSvg='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';

function renderGrid(){
  const list=VIDEOS.filter(v=> filter==='all' || (filter==='done')===done.has(v.n));
  grid.innerHTML = list.length ? list.map(v=>`
    <button class="card ${done.has(v.n)?'done':''}" data-n="${v.n}">
      <div class="thumb"><img loading="lazy" src="${v.thumb}" alt="">
        <span class="num">${pad(v.n)}</span>
        <span class="done-badge">${checkSvg}Saved</span>
        <span class="play"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span>
        <div class="meta"><div class="t">${v.title}</div><div class="s">15 sec · ${v.mb} MB</div></div>
      </div>
    </button>`).join('') : `<div class="empty">${filter==='done'?'Nothing downloaded yet.':'All caught up — every video is downloaded. 🎉'}</div>`;
  const d=done.size, all=VIDEOS.length;
  $('cAll').textContent=all; $('cDone').textContent=d; $('cTodo').textContent=all-d;
  $('statTxt').textContent=`${d} / ${all}`;
  $('ringFg').style.strokeDashoffset = 100.5*(1-d/all);
}
grid.addEventListener('click',e=>{const c=e.target.closest('.card'); if(c) openSheet(VIDEOS.findIndex(v=>v.n==c.dataset.n));});
$('filters').addEventListener('click',e=>{const c=e.target.closest('.chip'); if(!c)return;
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c)); filter=c.dataset.f; renderGrid();});
$('resetBtn').onclick=()=>{ if(confirm('Clear all downloaded marks on this device?')){done.clear();save();renderGrid();} };

/* ---------- preview sheet ---------- */
const vid=$('vid'), sheet=$('sheet');
function paintSheet(){
  const v=VIDEOS[current], isDone=done.has(v.n);
  $('sNum').textContent='#'+pad(v.n)+' of '+VIDEOS.length;
  $('sTitle').textContent=v.title;
  $('sCap').textContent=v.caption; $('sScreen').textContent=v.screen; $('sVo').textContent=v.vo;
  $('sStatus').className='status'+(isDone?' done':'');
  $('sStatus').innerHTML=isDone?checkSvg+' Already downloaded':'Not downloaded yet';
  const dl=$('dlBtn'); dl.href=url(v); dl.setAttribute('download',v.file);
  dl.className='btn primary'+(isDone?' done':'');
  dl.innerHTML=(isDone?checkSvg+' Downloaded — get again':'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-5-5m5 5l5-5M5 20h14"/></svg> Download #'+pad(v.n))+` <span style="opacity:.6;font-weight:500">${v.mb} MB</span>`;
  $('toggleBtn').textContent=isDone?'Unmark':'Mark as done';
}
function openSheet(i){
  current=i; const v=VIDEOS[i];
  vid.src=url(v); vid.poster=v.thumb;
  paintSheet(); sheet.classList.add('open'); document.body.style.overflow='hidden';
  vid.play().catch(()=>{});
  Hero.show(i);
}
function closeSheet(){ sheet.classList.remove('open'); vid.pause(); vid.removeAttribute('src'); vid.load(); document.body.style.overflow=''; }
function step(d){ openSheet((current+d+VIDEOS.length)%VIDEOS.length); }
sheet.addEventListener('click',e=>{ if(e.target.hasAttribute('data-close')||e.target.closest('.iconbtn[data-close]')) closeSheet(); });
$('prevBtn').onclick=()=>step(-1); $('nextBtn').onclick=()=>step(1);
document.addEventListener('keydown',e=>{ if(!sheet.classList.contains('open'))return;
  if(e.key==='Escape')closeSheet(); if(e.key==='ArrowRight')step(1); if(e.key==='ArrowLeft')step(-1); });
let tx=null; $('vid').parentElement.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
$('vid').parentElement.addEventListener('touchend',e=>{ if(tx==null)return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>70) step(dx<0?1:-1); tx=null; });

function markDone(n){ done.add(n); save(); paintSheet(); renderGrid(); }
$('dlBtn').addEventListener('click',()=>{ const n=VIDEOS[current].n; setTimeout(()=>{markDone(n); toast('#'+pad(n)+' marked as downloaded');},300); });
$('toggleBtn').onclick=()=>{ const n=VIDEOS[current].n; done.has(n)?done.delete(n):done.add(n); save(); paintSheet(); renderGrid(); };

// Save to Photos (iPhone/Android share sheet)
const canShareFiles = !!(navigator.canShare && navigator.canShare({files:[new File([''],'t.mp4',{type:'video/mp4'})]}));
if(!canShareFiles) $('shareBtn').style.display='none', $('toggleBtn').parentElement.style.gridTemplateColumns='1fr';
$('shareBtn').onclick=async()=>{
  const v=VIDEOS[current], b=$('shareBtn'); b.textContent='Preparing…'; b.disabled=true;
  try{
    const blob=await fetch(url(v)).then(r=>r.blob());
    const file=new File([blob],v.file,{type:'video/mp4'});
    await navigator.share({files:[file]});
    markDone(v.n); toast('#'+pad(v.n)+' saved & marked');
  }catch(e){ if(e.name!=='AbortError') toast('Could not share — use Download'); }
  b.textContent='Save to Photos'; b.disabled=false;
};
document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{
  try{ await navigator.clipboard.writeText(VIDEOS[current][b.dataset.copy]); toast('Copied'); }catch(e){ toast('Copy failed'); }
});

/* ---------- three.js hero ---------- */
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const Hero = (()=>{
  const canvas=$('scene');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0b0907);
  scene.fog=new THREE.Fog(0x0b0907,6,16);
  const pmrem=new THREE.PMREMGenerator(renderer);
  scene.environment=pmrem.fromScene(new RoomEnvironment(renderer),0.04).texture;

  const camera=new THREE.PerspectiveCamera(32,1,0.1,100);

  // lights: warm key (sunset), cool rim, fire glow
  const key=new THREE.SpotLight(0xffc48a,60,20,Math.PI/6,0.6,1.6);
  key.position.set(3,5,4); key.castShadow=true; key.shadow.mapSize.set(1024,1024); key.shadow.bias=-0.0004; scene.add(key);
  const rim=new THREE.DirectionalLight(0x8fb4ff,1.4); rim.position.set(-4,2,-3); scene.add(rim);
  const fire=new THREE.PointLight(0xff6a1a,6,6,2); fire.position.set(0,-0.6,1.6); scene.add(fire);
  scene.add(new THREE.AmbientLight(0xffe6cc,0.12));

  // floor: dark polished concrete
  const floor=new THREE.Mesh(new THREE.CircleGeometry(12,64),
    new THREE.MeshStandardMaterial({color:0x17110c,roughness:0.42,metalness:0.0}));
  floor.rotation.x=-Math.PI/2; floor.position.y=-1.25; floor.receiveShadow=true; scene.add(floor);

  // rounded-rect shape with normalized UVs for screens
  function screenGeo(w,h,r){
    const s=new THREE.Shape(), x=-w/2, y=-h/2;
    s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r); s.lineTo(x+w,y+h-r);
    s.quadraticCurveTo(x+w,y+h,x+w-r,y+h); s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
    s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y);
    const g=new THREE.ShapeGeometry(s,12), p=g.attributes.position, uv=g.attributes.uv;
    for(let i=0;i<p.count;i++) uv.setXY(i,(p.getX(i)-x)/w,(p.getY(i)-y)/h);
    return g;
  }
  const loader=new THREE.TextureLoader();
  const texCache={};
  const tex=i=>{ if(!texCache[i]){ const t=loader.load(VIDEOS[i].thumb); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; texCache[i]=t; } return texCache[i]; };

  const W=0.78,H=1.62,D=0.085;
  const frameMat=new THREE.MeshPhysicalMaterial({color:0x9a8f86,metalness:1,roughness:0.28,clearcoat:0.4});
  const backMat=new THREE.MeshPhysicalMaterial({color:0x2a2420,metalness:0.2,roughness:0.35,clearcoat:1,clearcoatRoughness:0.08});
  const lensMat=new THREE.MeshPhysicalMaterial({color:0x050505,metalness:0.6,roughness:0.05,clearcoat:1});
  const ringMat=new THREE.MeshStandardMaterial({color:0xbfb5ab,metalness:1,roughness:0.2});

  function makePhone(i){
    const g=new THREE.Group();
    const body=new THREE.Mesh(new RoundedBoxGeometry(W,H,D,6,0.1),[frameMat,frameMat,frameMat,frameMat,frameMat,backMat]);
    body.castShadow=true; g.add(body);
    // black bezel + screen
    const bezel=new THREE.Mesh(screenGeo(W-0.03,H-0.03,0.09),new THREE.MeshPhysicalMaterial({color:0x000000,roughness:0.1,clearcoat:1}));
    bezel.position.z=D/2+0.001; g.add(bezel);
    const scrMat=new THREE.MeshBasicMaterial({map:tex(i),toneMapped:false});
    const scr=new THREE.Mesh(screenGeo(W-0.075,H-0.075,0.07),scrMat); scr.position.z=D/2+0.002; g.add(scr);
    // glass reflection layer
    const glass=new THREE.Mesh(screenGeo(W-0.03,H-0.03,0.09),new THREE.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:0.08,roughness:0.02,metalness:0,clearcoat:1,envMapIntensity:2.2,depthWrite:false}));
    glass.position.z=D/2+0.003; g.add(glass);
    // dynamic island
    const isl=new THREE.Mesh(new RoundedBoxGeometry(0.2,0.055,0.002,3,0.027),new THREE.MeshBasicMaterial({color:0x000000}));
    isl.position.set(0,H/2-0.085,D/2+0.004); g.add(isl);
    // camera bump on back
    const bump=new THREE.Mesh(new RoundedBoxGeometry(0.32,0.32,0.03,4,0.07),backMat);
    bump.position.set(-W/2+0.2,H/2-0.2,-D/2-0.012); g.add(bump);
    [[-0.07,0.07],[-0.07,-0.07],[0.07,0]].forEach(([x,y])=>{
      const r=new THREE.Mesh(new THREE.CylinderGeometry(0.058,0.058,0.022,32),ringMat); r.rotation.x=Math.PI/2;
      r.position.set(-W/2+0.2+x,H/2-0.2+y,-D/2-0.03); g.add(r);
      const l=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.024,32),lensMat); l.rotation.x=Math.PI/2;
      l.position.copy(r.position); l.position.z-=0.002; g.add(l);
    });
    g.userData.scrMat=scrMat; g.userData.idx=i;
    return g;
  }

  const main=makePhone(0); scene.add(main);
  const left=makePhone(1), right=makePhone(2);
  left.position.set(-1.25,-0.15,-1.4); left.rotation.set(0,0.55,0.04); left.scale.setScalar(0.82);
  right.position.set(1.25,-0.15,-1.4); right.rotation.set(0,-0.55,-0.04); right.scale.setScalar(0.82);
  scene.add(left,right);

  // contact shadow blob
  const sc=document.createElement('canvas'); sc.width=sc.height=128; const sx=sc.getContext('2d');
  const gr=sx.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,'rgba(0,0,0,.7)'); gr.addColorStop(1,'rgba(0,0,0,0)');
  sx.fillStyle=gr; sx.fillRect(0,0,128,128);
  const blob=new THREE.Mesh(new THREE.PlaneGeometry(1.6,0.7),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,depthWrite:false}));
  blob.rotation.x=-Math.PI/2; blob.position.y=-1.245; scene.add(blob);

  // drifting embers
  const N=220, pos=new Float32Array(N*3), spd=new Float32Array(N);
  for(let i=0;i<N;i++){ pos[i*3]=(Math.random()-.5)*7; pos[i*3+1]=Math.random()*4-1.2; pos[i*3+2]=(Math.random()-.5)*5; spd[i]=0.15+Math.random()*0.4; }
  const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const ec=document.createElement('canvas'); ec.width=ec.height=32; const ex=ec.getContext('2d');
  const eg=ex.createRadialGradient(16,16,0,16,16,16); eg.addColorStop(0,'rgba(255,220,160,1)'); eg.addColorStop(.3,'rgba(255,140,40,.8)'); eg.addColorStop(1,'rgba(255,80,0,0)');
  ex.fillStyle=eg; ex.fillRect(0,0,32,32);
  const embers=new THREE.Points(pg,new THREE.PointsMaterial({size:0.06,map:new THREE.CanvasTexture(ec),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
  scene.add(embers);

  // input: pointer + device tilt
  let tgtX=0,tgtY=0;
  addEventListener('pointermove',e=>{ tgtX=(e.clientX/innerWidth-.5); tgtY=(e.clientY/innerHeight-.5); },{passive:true});
  addEventListener('deviceorientation',e=>{ if(e.gamma==null)return; tgtX=THREE.MathUtils.clamp(e.gamma/45,-.5,.5); tgtY=THREE.MathUtils.clamp((e.beta-45)/60,-.5,.5); });

  function resize(){
    const w=canvas.clientWidth,h=canvas.clientHeight; renderer.setSize(w,h,false);
    camera.aspect=w/h;
    const portrait=w/h<0.8;
    camera.fov=portrait?44:32;
    camera.position.set(0,0.15,portrait?4.6:4.4);
    camera.updateProjectionMatrix();
    left.visible=right.visible=w>360;
  }
  addEventListener('resize',resize); resize();

  // cycle screens
  let cycleIdx=0, cycleOn=true;
  function setScreen(ph,i){ ph.userData.idx=i; ph.userData.scrMat.map=tex(i); ph.userData.scrMat.needsUpdate=true; }
  setInterval(()=>{ if(!cycleOn||!visible)return; cycleIdx=(cycleIdx+1)%VIDEOS.length;
    setScreen(main,cycleIdx); setScreen(left,(cycleIdx+VIDEOS.length-1)%VIDEOS.length); setScreen(right,(cycleIdx+1)%VIDEOS.length); spin=1; },2600);
  let spin=0;

  let visible=true;
  new IntersectionObserver(([en])=>{visible=en.isIntersecting;}).observe(canvas);
  const clock=new THREE.Clock();
  renderer.setAnimationLoop(()=>{
    if(!visible) return;
    const t=clock.getElapsedTime(), dt=Math.min(clock.getDelta?0.016:0.016,0.05);
    spin*=0.93;
    main.position.y=Math.sin(t*1.1)*0.06+0.02;
    main.rotation.y += ((tgtX*0.7 + Math.sin(t*0.4)*0.25 + spin*Math.PI*0.15) - main.rotation.y)*0.06;
    main.rotation.x += ((tgtY*0.35 - 0.04) - main.rotation.x)*0.06;
    left.position.y=-0.15+Math.sin(t*1.1+1)*0.05; right.position.y=-0.15+Math.sin(t*1.1+2)*0.05;
    blob.scale.setScalar(1-main.position.y*0.6); blob.material.opacity=0.85-main.position.y*2;
    fire.intensity=5+Math.sin(t*9)*0.8+Math.sin(t*23)*0.5;
    const p=pg.attributes.position.array;
    for(let i=0;i<N;i++){ p[i*3+1]+=spd[i]*0.008; p[i*3]+=Math.sin(t+i)*0.0015; if(p[i*3+1]>3){p[i*3+1]=-1.2;} }
    pg.attributes.position.needsUpdate=true;
    renderer.render(scene,camera);
  });

  return { show(i){ cycleIdx=i; setScreen(main,i); } };
})();

renderGrid();
</script>
